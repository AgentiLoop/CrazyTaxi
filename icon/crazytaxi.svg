<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE04A"/>
      <stop offset="1" stop-color="#F5A300"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="checks" width="96" height="96" patternUnits="userSpaceOnUse" x="100" y="660">
      <rect width="96" height="96" fill="#fff"/>
      <rect width="48" height="48" fill="#111"/>
      <rect x="48" y="48" width="48" height="48" fill="#111"/>
    </pattern>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  </g>
  <g clip-path="url(#tile)">
    <!-- checkered taxi stripe -->
    <rect x="100" y="660" width="824" height="96" fill="url(#checks)"/>
    <rect x="100" y="652" width="824" height="10" fill="#111"/>
    <rect x="100" y="754" width="824" height="10" fill="#111"/>
    <!-- top shine -->
    <rect x="100" y="100" width="824" height="330" fill="url(#shine)"/>
    <!-- roof sign -->
    <rect x="382" y="170" width="260" height="92" rx="26" fill="#111"/>
    <text x="512" y="236" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial" font-weight="900"
          font-size="64" letter-spacing="6" fill="#FFD21F">TAXI</text>
    <!-- speed lines -->
    <g fill="#111" opacity=".85">
      <rect x="130" y="372" width="120" height="22" rx="11"/>
      <rect x="100" y="446" width="130" height="22" rx="11"/>
      <rect x="130" y="520" width="100" height="22" rx="11"/>
    </g>
  </g>
  <!-- CT, slanted for speed -->
  <g transform="translate(505 600) skewX(-12)">
    <text x="0" y="0" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial" font-weight="900"
          font-size="380" letter-spacing="-10" fill="#fff" stroke="#fff" stroke-width="44" stroke-linejoin="round">CT</text>
    <text x="0" y="0" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Arial" font-weight="900"
          font-size="380" letter-spacing="-10" fill="#111">CT</text>
  </g>
</svg>
